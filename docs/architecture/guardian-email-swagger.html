<div class="topnote">Guardian Email API — static Swagger. Browsing works offline-ish (needs internet for the UI library). To <b>execute</b> requests, run <b>npm run email:sandbox</b> and this page will call http://localhost:4000.</div>
<div id="swagger-ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
<script>
  window.ui = SwaggerUIBundle({ spec: {"openapi":"3.0.0","info":{"title":"Guardian Email API — sandbox","version":"1.0.0","description":"Browse every email endpoint. To use \"Try it out\", run the sandbox: npm run email:sandbox (starts http://localhost:4000)."},"servers":[{"url":"http://localhost:4000"}],"paths":{"/api/v1/email/config":{"get":{"summary":"Show the effective email configuration (API keys redacted)","tags":["Email"],"responses":{"200":{"description":"Current provider, safety switches and validation state"},"403":{"description":"Admin role required"}}}},"/api/v1/email/verify-connection":{"post":{"summary":"Check that the mail provider is reachable without sending anything","description":"Runs a real SMTP handshake when EMAIL_PROVIDER is \"smtp\". HTTP API providers have no equivalent, and report as unsupported.\n","tags":["Email"],"requestBody":{"required":false,"content":{"application/json":{"schema":{"type":"object","properties":{"provider":{"type":"string","enum":["resend","brevo","mailersend","smtp","dryrun"]}}}}}},"responses":{"200":{"description":"Connection succeeded, or verification is unsupported"},"502":{"description":"Connection failed"}}}},"/api/v1/email/templates":{"get":{"summary":"List available email templates and their field metadata","tags":["Email"],"responses":{"200":{"description":"Template catalogue"}}}},"/api/v1/email/templates/{type}/sample":{"get":{"summary":"Get the sample payload for a template","tags":["Email"],"parameters":[{"in":"path","name":"type","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Sample data"},"400":{"description":"Unknown template"}}}},"/api/v1/email/preview":{"post":{"summary":"Render a template without sending it","tags":["Email"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["template"],"properties":{"template":{"type":"string","example":"patient-alert","enum":["welcome","verify-email","account-approved","staff-invite","password-reset","otp","password-expiry-reminder","patient-alert","task-assigned","care-plan-updated","daily-report","appointment-reminder","appointment-confirmed","appointment-cancelled","results-ready","secure-message","account-locked","suspicious-login","two-factor-enabled","shift-reminder","receipt","custom-message","render-check"],"description":"Choose a template. Set the recipient in data.to and edit content via the data fields (call GET /api/v1/email/templates/{type}/sample for a ready-made payload)."},"data":{"type":"object"},"format":{"type":"string","enum":["json","html"]}}}}}},"responses":{"200":{"description":"Rendered subject, html and text"},"400":{"description":"Unknown template or missing required fields"}}}},"/api/v1/email/send-option":{"post":{"summary":"Send an email by option (destination + email option) — Brevo-focused simple send","description":"The simplest way to send: provide a destination address (\"to\") and an email option (\"option\", a template key). Any fields the template needs that you do not provide are filled from that template's sample data, so a minimal { to, option } request always sends a valid email. With EMAIL_PROVIDER=brevo and a BREVO_API_KEY set, it delivers via Brevo.\n","tags":["Email"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["to","option"],"properties":{"to":{"type":"string","description":"Destination email address","example":"someone@example.com"},"option":{"type":"string","description":"Email option (template key)","example":"welcome","enum":["welcome","verify-email","account-approved","staff-invite","password-reset","otp","password-expiry-reminder","patient-alert","task-assigned","care-plan-updated","daily-report","appointment-reminder","appointment-confirmed","appointment-cancelled","results-ready","secure-message","account-locked","suspicious-login","two-factor-enabled","shift-reminder","receipt","custom-message","render-check"]},"data":{"type":"object","description":"Optional overrides for the template's fields"},"provider":{"type":"string","enum":["brevo","resend","mailersend","smtp","dryrun"],"description":"Overrides EMAIL_PROVIDER for this request"},"dryRun":{"type":"boolean","description":"Render and record without delivering"}}}}}},"responses":{"202":{"description":"Accepted for delivery"},"400":{"description":"Missing destination/option or unknown option"},"403":{"description":"Admin role required, or recipient blocked by the allowlist"},"502":{"description":"Provider (Brevo) rejected the message"}}}},"/api/v1/email/send":{"post":{"summary":"Send a templated email","tags":["Email"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["template","data"],"properties":{"template":{"type":"string","example":"otp","enum":["welcome","verify-email","account-approved","staff-invite","password-reset","otp","password-expiry-reminder","patient-alert","task-assigned","care-plan-updated","daily-report","appointment-reminder","appointment-confirmed","appointment-cancelled","results-ready","secure-message","account-locked","suspicious-login","two-factor-enabled","shift-reminder","receipt","custom-message","render-check"],"description":"Choose a template. Set the recipient in data.to and edit content via the data fields (call GET /api/v1/email/templates/{type}/sample for a ready-made payload)."},"data":{"type":"object","example":{"to":"nurse@example.com","name":"Alex","otp":"482913"}},"provider":{"type":"string","enum":["resend","brevo","mailersend","smtp","dryrun"],"description":"Overrides EMAIL_PROVIDER for this request"},"dryRun":{"type":"boolean","description":"Render and record the message without delivering it"}}}}}},"responses":{"202":{"description":"Accepted for delivery"},"400":{"description":"Validation error"},"403":{"description":"Recipient blocked by the allowlist"},"502":{"description":"Provider rejected the message"}}}},"/api/v1/email/send-raw":{"post":{"summary":"Send an email with an explicit subject and body","tags":["Email"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["to","subject"],"properties":{"to":{"oneOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]},"subject":{"type":"string"},"html":{"type":"string"},"text":{"type":"string"},"cc":{"type":"array","items":{"type":"string"}},"bcc":{"type":"array","items":{"type":"string"}},"replyTo":{"type":"string"},"provider":{"type":"string","enum":["resend","brevo","mailersend","smtp","dryrun"]},"dryRun":{"type":"boolean"}}}}}},"responses":{"202":{"description":"Accepted for delivery"}}}},"/api/v1/email/send-bulk":{"post":{"summary":"Send one templated email per recipient","tags":["Email"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["template","recipients"],"properties":{"template":{"type":"string","enum":["welcome","verify-email","account-approved","staff-invite","password-reset","otp","password-expiry-reminder","patient-alert","task-assigned","care-plan-updated","daily-report","appointment-reminder","appointment-confirmed","appointment-cancelled","results-ready","secure-message","account-locked","suspicious-login","two-factor-enabled","shift-reminder","receipt","custom-message","render-check"],"description":"Choose a template. Set the recipient in data.to and edit content via the data fields (call GET /api/v1/email/templates/{type}/sample for a ready-made payload)."},"recipients":{"type":"array","description":"Addresses, or objects merged over the shared data","items":{"oneOf":[{"type":"string"},{"type":"object"}]}},"data":{"type":"object"},"provider":{"type":"string","enum":["resend","brevo","mailersend","smtp","dryrun"]},"dryRun":{"type":"boolean"}}}}}},"responses":{"202":{"description":"Per-recipient results"}}}},"/api/v1/email/test":{"post":{"summary":"Send the built-in rendering smoke test","tags":["Email"],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["to"],"properties":{"to":{"type":"string"},"provider":{"type":"string","enum":["resend","brevo","mailersend","smtp","dryrun"]},"dryRun":{"type":"boolean"}}}}}},"responses":{"202":{"description":"Test email accepted"}}}},"/api/v1/email/outbox":{"get":{"summary":"Inspect recent send attempts (sent, dry-run, blocked and failed)","tags":["Email"],"parameters":[{"in":"query","name":"limit","schema":{"type":"integer"}},{"in":"query","name":"template","schema":{"type":"string"}},{"in":"query","name":"includeBody","schema":{"type":"boolean"}}],"responses":{"200":{"description":"Outbox entries, newest first"}}},"delete":{"summary":"Clear the in-memory outbox","tags":["Email"],"responses":{"200":{"description":"Outbox cleared"}}}},"/api/v1/email/outbox/{id}":{"get":{"summary":"Get a single outbox entry including the rendered body","tags":["Email"],"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Outbox entry"},"404":{"description":"Not found"}}}},"/api/v1/email/inbox":{"get":{"summary":"Browse the persisted \"Sent\" inbox (survives restarts)","description":"Lists every email the tool has produced, newest first, from MongoDB. Falls back to the in-memory outbox when no database is connected (see the \"source\" field in the response).\n","tags":["Email"],"parameters":[{"in":"query","name":"page","schema":{"type":"integer"}},{"in":"query","name":"limit","schema":{"type":"integer"}},{"in":"query","name":"status","schema":{"type":"string","enum":["sent","dry-run","blocked","failed"]}},{"in":"query","name":"template","schema":{"type":"string"}},{"in":"query","name":"to","schema":{"type":"string"}},{"in":"query","name":"q","description":"Free-text search over subject, recipient, template and sender","schema":{"type":"string"}},{"in":"query","name":"includeBody","schema":{"type":"boolean"}}],"responses":{"200":{"description":"A page of sent messages"}}},"delete":{"summary":"Delete every message in the sent inbox","tags":["Email"],"responses":{"200":{"description":"Inbox cleared"}}}},"/api/v1/email/inbox/stats":{"get":{"summary":"Counts of sent messages grouped by status","tags":["Email"],"responses":{"200":{"description":"Totals by status"}}}},"/api/v1/email/inbox/{id}":{"get":{"summary":"One sent message including the rendered body","tags":["Email"],"parameters":[{"in":"path","name":"id","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The message"},"404":{"description":"Not found"}}}},"/api/v1/email/inbox-view":{"get":{"summary":"Browsable read-only web page for the sent inbox","description":"Static page (disabled in production unless EMAIL_INBOX_ENABLED=true). Paste an admin bearer token in the page to browse sent mail.\n","tags":["Email"],"responses":{"200":{"description":"HTML page"},"404":{"description":"Disabled"}}}},"/api/v1/email/test-console":{"get":{"summary":"Browser test console for previewing and sending Guardian emails","description":"Static page. Disabled in production unless EMAIL_TEST_CONSOLE_ENABLED=true. All actions it performs require an admin bearer token entered in the page.\n","tags":["Email"],"responses":{"200":{"description":"HTML page"},"404":{"description":"Console disabled"}}}}},"security":[]}, dom_id: "#swagger-ui", deepLinking: true, presets: [SwaggerUIBundle.presets.apis], tryItOutEnabled: true });
</script>
